name: Build and Deploy

on:
  push:
    branches: [ master ]
  # Sent by the ClauseBuilder repo's workflow whenever its main branch changes.
  repository_dispatch:
    types: [ clausebuilder-updated ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_CLAUSEBUILDER_TOKEN: ${{ secrets.CLAUSEBUILDER_TOKEN != '' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: site

      - name: Build
        run: npm run build
        working-directory: site
        env:
          PUBLIC_BUILD_VERSION: ${{ github.sha }}-${{ github.run_number }}
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

      # ClauseBuilder lives in its own private repo and is served from /ClauseBuilder/.
      - name: Warn if ClauseBuilder token is missing
        if: env.HAS_CLAUSEBUILDER_TOKEN != 'true'
        run: echo "::warning::CLAUSEBUILDER_TOKEN secret is not set; /ClauseBuilder/ will not be deployed."

      - name: Checkout ClauseBuilder
        if: env.HAS_CLAUSEBUILDER_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: Poonwahj/ClauseBuilder
          ref: main
          token: ${{ secrets.CLAUSEBUILDER_TOKEN }}
          path: clausebuilder

      - name: Build ClauseBuilder
        if: env.HAS_CLAUSEBUILDER_TOKEN == 'true'
        working-directory: clausebuilder
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.CLAUSEBUILDER_GOOGLE_CLIENT_ID }}
          VITE_MS_CLIENT_ID: ${{ secrets.CLAUSEBUILDER_MS_CLIENT_ID }}
        run: |
          npm ci
          npm run build
          cp -r dist "$GITHUB_WORKSPACE/site/dist/ClauseBuilder"

      - name: Push build output to deploy branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(git rev-parse --short HEAD)-$(date +%Y%m%d)
          git clone --branch deploy --single-branch \
            "https://x-access-token:${TOKEN}@github.com/Poonwahj/FishSauceGames.git" \
            /tmp/deploy-repo || \
          git clone \
            "https://x-access-token:${TOKEN}@github.com/Poonwahj/FishSauceGames.git" \
            /tmp/deploy-repo
          cd /tmp/deploy-repo
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B deploy
          git rm -rf . --quiet 2>/dev/null || true
          cp -r $GITHUB_WORKSPACE/site/dist/. .
          git add -A
          git diff --cached --quiet && echo "No changes to deploy" || (git commit -m "Deploy $VERSION" && git push origin deploy)
